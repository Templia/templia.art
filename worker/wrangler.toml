name = "templia-markdown-for-agents"
main = "src/index.js"
compatibility_date = "2026-04-17"

# Run on every request to templia.art. The Worker short-circuits
# (simple fetch pass-through) unless the client asked for markdown.
[[routes]]
pattern = "templia.art/*"
zone_name = "templia.art"

# Workers AI binding — used for `env.AI.toMarkdown(...)`.
# This is the same conversion engine that powers Cloudflare's native
# Markdown for Agents feature on paid plans.
[ai]
binding = "AI"

# Observability — free tier, helps when debugging deploys.
[observability]
enabled = true

# Daily journey emails (src/subscriptions.js).
# 12:00 UTC = 07:00 in Tulum (UTC-5 year-round).
[triggers]
crons = ["0 12 * * *"]

[vars]
SITE_URL = "https://templia.art"
EMAIL_FROM = "Aluxes of Templia <journey@templia.art>"

# Created with: npx wrangler d1 create templia-subscriptions
# Schema:       npx wrangler d1 migrations apply templia-subscriptions --remote
# Secret:       npx wrangler secret put RESEND_API_KEY
[[d1_databases]]
binding = "DB"
database_name = "templia-subscriptions"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"
